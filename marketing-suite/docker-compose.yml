# Plane da Marketing Suite, em /opt/plane no VPS (tarefas.marketingsuite.online).
# Base: deployments/cli/community/docker-compose.yml da v1.4.2, com cinco mudancas:
#   1. imagens na tag fixa (APP_RELEASE no .env), nunca "stable";
#   2. o proxy do Plane escuta so em 127.0.0.1:8098; quem atende a internet e o nginx do CloudPanel;
#   3. teto de memoria em cada container, porque o VPS tem 2 vCPU e divide a RAM com Postiz e Chatwoot;
#   4. senhas do banco e da fila vindas do .env (o original deixa "plane:plane" embutido nas URLs);
#   5. MinIO do fork pgsty, porque a imagem original nao baixa mais.
# Tudo que e segredo mora no .env (root, 600), gerado por gerar-env.sh no proprio servidor.

x-db-env: &db-env
  PGHOST: plane-db
  PGDATABASE: plane
  POSTGRES_USER: plane
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: plane
  POSTGRES_PORT: 5432
  PGDATA: /var/lib/postgresql/data

x-redis-env: &redis-env
  REDIS_HOST: plane-redis
  REDIS_PORT: 6379
  REDIS_URL: redis://plane-redis:6379/

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ""
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: uploads

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  CERT_EMAIL: ""
  # Vazio quebra o Caddyfile do Plane ("acme_ca" sem argumento). Com SITE_ADDRESS ":80" o Caddy
  # nao pede certificado nenhum; o valor so precisa existir.
  CERT_ACME_CA: https://acme-v02.api.letsencrypt.org/directory
  CERT_ACME_DNS: ""
  LISTEN_HTTP_PORT: 80
  LISTEN_HTTPS_PORT: 443
  BUCKET_NAME: uploads
  # Sem certificado no Caddy do Plane: o HTTPS termina no nginx do CloudPanel.
  SITE_ADDRESS: ":80"
  # A porta so existe em 127.0.0.1, entao o unico cliente e o nginx do host.
  TRUSTED_PROXIES: 0.0.0.0/0

x-mq-env: &mq-env
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: 5672
  RABBITMQ_DEFAULT_USER: plane
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
  RABBITMQ_DEFAULT_VHOST: plane
  RABBITMQ_VHOST: plane

x-live-env: &live-env
  API_BASE_URL: http://api:8000
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}

x-app-env: &app-env
  WEB_URL: https://${APP_DOMAIN}
  DEBUG: 0
  CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
  GUNICORN_WORKERS: 1
  USE_MINIO: 1
  DATABASE_URL: postgresql://plane:${POSTGRES_PASSWORD}@plane-db/plane
  SECRET_KEY: ${SECRET_KEY}
  AMQP_URL: amqp://plane:${RABBITMQ_PASSWORD}@plane-mq:5672/plane
  API_KEY_RATE_LIMIT: 60/minute
  MINIO_ENDPOINT_SSL: 0
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
  WEBHOOK_ALLOWED_IPS: ""
  WEBHOOK_ALLOWED_HOSTS: ""
  # Fase 0 (spec secao 3, F0-020): o "What's new" nao carrega mais o iframe de sites.plane.so
  INSTANCE_CHANGELOG_URL: ""

# Fase 0 (spec secao 3, F0-021): a imagem backend nao fala com a Plane nem com o GitHub
x-hosts-bloqueados: &hosts-bloqueados
  - "telemetry.plane.so:127.0.0.1"
  - "api.github.com:127.0.0.1"

x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *logs
    image: makeplane/plane-frontend:${APP_RELEASE}
    restart: unless-stopped
    mem_limit: 128m
    depends_on: [api, worker]

  space:
    <<: *logs
    image: makeplane/plane-space:${APP_RELEASE}
    restart: unless-stopped
    mem_limit: 256m
    depends_on: [api, worker, web]

  admin:
    <<: *logs
    image: makeplane/plane-admin:${APP_RELEASE}
    restart: unless-stopped
    mem_limit: 128m
    depends_on: [api, web]

  live:
    <<: *logs
    image: makeplane/plane-live:${APP_RELEASE}
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: [*live-env, *redis-env]
    depends_on: [api, web]

  api:
    <<: *logs
    image: makeplane/plane-backend:${APP_RELEASE}
    command: ./bin/docker-entrypoint-api.sh
    restart: unless-stopped
    extra_hosts: *hosts-bloqueados
    mem_limit: 768m
    volumes:
      - logs_api:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on: [plane-db, plane-redis, plane-mq]

  worker:
    <<: *logs
    image: makeplane/plane-backend:${APP_RELEASE}
    command: ./bin/docker-entrypoint-worker.sh
    restart: unless-stopped
    extra_hosts: *hosts-bloqueados
    mem_limit: 768m
    volumes:
      - logs_worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on: [api, plane-db, plane-redis, plane-mq]

  beat-worker:
    <<: *logs
    image: makeplane/plane-backend:${APP_RELEASE}
    command: ./bin/docker-entrypoint-beat.sh
    restart: unless-stopped
    extra_hosts: *hosts-bloqueados
    mem_limit: 384m
    volumes:
      - logs_beat-worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on: [api, plane-db, plane-redis, plane-mq]

  migrator:
    <<: *logs
    image: makeplane/plane-backend:${APP_RELEASE}
    command: ./bin/docker-entrypoint-migrator.sh
    restart: on-failure
    extra_hosts: *hosts-bloqueados
    mem_limit: 768m
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on: [plane-db, plane-redis]

  plane-db:
    <<: *logs
    image: postgres:15.7-alpine
    # O original pede 1000 conexoes; cada uma reserva memoria. Tres pessoas cabem em 100.
    command: postgres -c 'max_connections=100'
    restart: unless-stopped
    mem_limit: 512m
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data

  plane-redis:
    <<: *logs
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - redisdata:/data

  plane-mq:
    <<: *logs
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    <<: *logs
    # O minio/minio saiu do Docker Hub e o quay.io passou a pedir login (setembro de 2026).
    # O pgsty/minio e o fork mantido que o proprio Plane adotou (makeplane/plane#9823).
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /export --console-address ":9090"
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export

  proxy:
    <<: *logs
    image: makeplane/plane-proxy:${APP_RELEASE}
    restart: unless-stopped
    mem_limit: 128m
    environment:
      <<: *proxy-env
    ports:
      - "127.0.0.1:${LISTEN_LOCAL_PORT:-8098}:80"
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    depends_on: [web, api, space, admin, live]

volumes:
  pgdata:
  redisdata:
  uploads:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  rabbitmq_data:
  proxy_config:
  proxy_data:
