# ===== Marketing Suite | Fase 0 | spec secao 3 =====
# PARTE A: no topo do arquivo, fora de qualquer "server { }".
map $upstream_http_content_type $ms_cache_html {
    default        "";
    "~^text/html"  "no-cache";
}

# PARTE B: dentro do "server { }" que tem "server_name tarefas.marketingsuite.online" e o proxy
# para 127.0.0.1:8098, antes de "location / {".
location ^~ /ms/ {
    root /home/tarefas/htdocs/tarefas.marketingsuite.online;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
}

# PARTE C: no MESMO bloco onde ja esta a linha "add_header X-Robots-Tag".
add_header Cache-Control $ms_cache_html;

# PARTE D: no lugar exato das linhas antigas do ms-oculta.
# A linha proxy_set_header vai no MESMO bloco das outras linhas proxy_set_header.
# O vhost ja tinha Accept-Encoding vazio; a linha nao e duplicada.
proxy_set_header Accept-Encoding "";
sub_filter '</head>' '<script id="ms-marca-js">(function(d,w){if(w.__msMarca)return;w.__msMarca=1;try{w.localStorage.setItem("userLanguage","pt-BR")}catch(e){}function g(){if(d.getElementById("ms-marca"))return;var p=d.head||d.documentElement;if(!p)return;var l=d.createElement("link");l.id="ms-marca";l.rel="stylesheet";l.href="/ms/marca.css?v=1";p.appendChild(l)}g();new MutationObserver(g).observe(d,{childList:true})})(document,window);</script></head>';
sub_filter_once on;
# ===== fim Marketing Suite | Fase 0 =====
