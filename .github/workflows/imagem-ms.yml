# Gera a imagem Docker do fork da Marketing Suite e publica no GHCR.
#
# Dispara em tag no formato v2.6.0-ms.N (push de tag) ou a mao, pela aba Actions.
# Usa o Dockerfile da raiz sem mudanca, como a esteira oficial do Vikunja, mas so linux/amd64,
# que e a arquitetura do VPS. A imagem sai em ghcr.io/<dono>/<repositorio>:<tag>.
# Nao publica "latest": a producao sempre aponta para uma tag exata.
name: Imagem Marketing Suite

on:
  push:
    tags:
      - 'v*-ms.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da imagem, por exemplo v2.6.0-ms.1. Vazio usa o git describe.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: imagem-ms-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Liberar disco
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          docker-images: false
          swap-storage: false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O git describe precisa do historico e das tags.
          fetch-depth: 0
      - name: Versao
        id: versao
        env:
          TAG_MANUAL: ${{ inputs.tag }}
          REF_TIPO: ${{ github.ref_type }}
          REF_NOME: ${{ github.ref_name }}
        run: |
          if [ -n "$TAG_MANUAL" ]; then
            V="$TAG_MANUAL"
          elif [ "$REF_TIPO" = "tag" ]; then
            V="$REF_NOME"
          else
            V="$(git describe --tags --always)"
          fi
          # Tag de imagem aceita so letra, numero, ponto, hifen e sublinhado.
          if ! printf '%s' "$V" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "versao invalida para tag de imagem: $V" >&2
            exit 1
          fi
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          echo "Versao: $V"
      - name: Login no GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: latest
      - name: Construir e publicar
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.versao.outputs.versao }}
          # O source liga o pacote a este repositorio no GHCR; o resto identifica a build.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Marketing Suite Tarefas
            org.opencontainers.image.description=Fork do Vikunja com a marca Marketing Suite (AGPL-3.0)
            org.opencontainers.image.version=${{ steps.versao.outputs.versao }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            RELEASE_VERSION=${{ steps.versao.outputs.versao }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
